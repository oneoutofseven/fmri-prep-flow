[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-prep-flow"
dynamic = ["version"]
description = "A Singularity-based fMRIPrep workflow with BIDS validation and per-run quality review"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fMRI", "fMRIPrep", "BIDS", "Singularity", "neuroimaging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24,<3",
  "nibabel>=5,<6",
  "matplotlib>=3.9,<4",
  "pybids>=0.19,<0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]
validator = ["bids-validator-deno==3.0.2", "deno==2.9.7"]

[project.scripts]
fmri-prep-flow = "fmri_prep_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "fmri_prep_flow.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
